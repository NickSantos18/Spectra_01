[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spectra-link-guard"
version = "0.1.0"
description = "Análise passiva de risco de links (proteção ao consumidor) — módulo defensivo do Spectra"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
# tldextract usa a Public Suffix List real; sem ele o módulo cai numa tabela embutida.
# cryptography permite ler o certificado mesmo quando a cadeia não valida.
extras = ["tldextract>=5.1", "cryptography>=42.0"]
web = ["fastapi>=0.115", "uvicorn[standard]>=0.30", "pydantic[email]>=2.9", "argon2-cffi>=25.1", "Pillow>=13.0", "google-auth[requests]>=2.40"]
# Assistente com IA nos chats; sem ele (ou sem chave), os chats usam respostas por regra.
ia = ["anthropic>=1.12"]
dev = ["pytest>=8.0"]

[project.scripts]
spectra-link-guard = "spectra_link_guard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"spectra_link_guard.web" = ["static/*", "parciais/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
