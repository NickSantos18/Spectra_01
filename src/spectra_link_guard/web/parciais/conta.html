<div class="conta-superior" data-conta hidden>
  <a class="conta-acesso" href="/painel/perfil" data-menu="perfil" data-perfil-acesso aria-label="Abrir meu perfil">
    <span class="conta-avatar" data-conta-inicial aria-hidden="true"></span>
    <span class="conta-nome-superior" data-conta-nome></span>
  </a>
  <button class="conta-sair-superior" type="button" data-sair aria-label="Sair da conta" title="Sair da conta">

  </button>
</div>
<dialog class="perfil-cofre" data-perfil-cofre aria-label="Abrir perfil" aria-describedby="cofre-instrucao cofre-alternativa">
  <button class="perfil-cofre-cancelar" type="button" data-cofre-cancelar>Cancelar <span aria-hidden="true">×</span></button>
  <div class="perfil-cofre-conteudo">
  <div class="perfil-cofre-palco">
    <div class="perfil-cofre-foto" data-cofre-foto aria-hidden="true"></div>
    <button class="perfil-cofre-cadeado" data-cofre-cadeado type="button" aria-label="Encaixar a chave no cadeado" aria-disabled="true">
      <svg viewBox="0 0 240 280" fill="none" aria-hidden="true">
        <path class="perfil-cofre-arco" d="M78 113V77a42 42 0 0 1 84 0v36"/>
        <rect class="perfil-cofre-corpo" x="50" y="110" width="140" height="110" rx="9"/>
        <path class="perfil-cofre-detalhe" d="M66 124h108M66 206h108"/>
        <g data-cofre-fechadura class="perfil-cofre-fechadura"><circle cx="120" cy="153" r="10"/><path d="m115 160-3 20h16l-3-20"/></g>
        <circle class="perfil-cofre-alvo" cx="120" cy="160" r="31"/>

    </button>
    <div class="perfil-cofre-fragmentos" data-cofre-fragmentos aria-hidden="true"></div>
    <div class="perfil-cofre-onda" aria-hidden="true"></div>
  <button class="perfil-cofre-chave" data-cofre-chave type="button" aria-label="Selecionar chave; depois ative o cadeado" aria-pressed="false" disabled>

  </button>
  </div>
  <div class="perfil-cofre-instrucoes">
    <p id="cofre-instrucao" data-cofre-mensagem role="status" aria-live="polite">Arraste a chave até a fechadura.</p>
    <p id="cofre-alternativa">Ou selecione a chave e depois o cadeado, com toque ou teclado.</p>
  </div>
  </div>
</dialog>
